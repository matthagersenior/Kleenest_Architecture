name: Build and Deploy Kleenest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify Node runtime
        run: node --version && npm --version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify required production configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          test -n "$VITE_SUPABASE_URL" || { echo 'ERROR: VITE_SUPABASE_URL is not configured in GitHub Actions secrets'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'ERROR: VITE_SUPABASE_PUBLISHABLE_KEY is not configured in GitHub Actions secrets'; exit 1; }
          echo "Supabase URL configured: ${VITE_SUPABASE_URL:0:32}..."
          echo "Supabase publishable key configured: yes"

      - name: Build production app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify correct Kleenest React artifact
        run: |
          set -e
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"
          if grep -RniE 'Production capability graph|production-reconciled capability explorer|static deployment safety layer' dist --exclude='*.map'; then
            echo 'ERROR: stale capability-graph artifact detected in dist'
            exit 1
          fi
          if ! grep -q '/assets/.*\.js' dist/index.html; then
            echo 'ERROR: dist/index.html does not contain a compiled Vite JavaScript bundle'
            cat dist/index.html
            exit 1
          fi
          cp dist/index.html dist/404.html
          echo "Verified React Pages artifact: $(du -sh dist | cut -f1)"
          head -c 800 dist/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
