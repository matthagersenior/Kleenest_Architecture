name: Build and Deploy Kleenest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  NODE_VERSION: 22
  VITE_SUPABASE_URL: https://ssgesjzdvdsqacdtasje.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f1rbczgvWKSQy2g9mTDQZg_K9Wv19bL
  VITE_PUBLIC_APP_URL: https://matthagersenior.github.io/Kleenest_Architecture
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify Node runtime
        run: node --version && npm --version
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Pages source ownership
        run: node scripts/pages-smoke.mjs
      - name: Audit canonical architecture
        run: npm run audit:runner
      - name: Audit canonical route contract
        run: npm run audit:routes
      - name: Audit Enterprise control plane
        run: node scripts/enterprise-control-plane-audit.mjs
      - name: Audit Admin control plane
        run: node scripts/admin-control-plane-audit.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify production configuration
        run: |
          set -e
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_PUBLIC_APP_URL"
          echo "Supabase project and public app URL configured."
      - name: Build production app
        run: npm run build
      - name: Verify correct Kleenest React artifact
        run: |
          set -e
          test -s dist/index.html
          test -d dist/assets
          test -n "$(find dist/assets -type f -name '*.js' -print -quit)"
          test -n "$(find dist/assets -type f -name '*.css' -print -quit)"
          if grep -RniE 'Production capability graph|production-reconciled capability explorer|static deployment safety layer' dist --exclude='*.map'; then
            echo 'ERROR: stale capability-graph artifact detected in dist'
            exit 1
          fi
          cp dist/index.html dist/404.html
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4